name: Playtest
description: A playtest of a version or a feature, by a person or by an automated run; findings become their own issues.
title: "[Playtest] "
labels: ["type: playtest"]
body:
  - type: markdown
    attributes:
      value: |
        Write short, simple and direct: bullet points, no filler, one thread from top to bottom. Link files and lines.
        One issue per playtest session. Every finding that needs work gets its own bug, feature or refactoring
        issue, linked under "Findings". The playtest issue closes when all findings are linked.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What is tested, and why now? Name the features or issues under test.
      placeholder: The new control panel of #42 in all formats, with keys and a gamepad.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Commit, tag or build under test.
      placeholder: main @ abc1234
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Manual · a person plays
        - Automated · scripted runs (playtester, battery)
        - Both
    validations:
      required: true

  - type: textarea
    id: plan
    attributes:
      label: Test plan
      description: Scenarios, templates or levels, devices, window sizes; what counts as passed.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Core · core/ (Variant, Object, I/O, math)
        - Scene · scene/ (nodes, resources, GUI)
        - Servers · servers/ (rendering, physics, audio, navigation, text)
        - Editor · editor/
        - Modules · modules/ (GDScript, glTF, …)
        - .NET · modules/mono (C# bindings)
        - Platform & drivers · platform/, drivers/
        - Third-party · thirdparty/
        - Build & CI · SCons, .github/, misc/
        - Tests · tests/
        - Docs · doc/ (class reference)
    validations:
      required: true

  - type: textarea
    id: results
    attributes:
      label: Results
      description: Per scenario passed or failed, with numbers (runs, problems, steps) and screenshots.

  - type: textarea
    id: findings
    attributes:
      label: Findings
      description: One line per finding with its own issue (#N); severity in a word.
      placeholder: |
        - #57 Bug · text cut off at the smallest window (minor)

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, engine version, hardware, input devices.
