name: Concept
description: "Work out a design before features are cut from it."
title: "[Concept] "
labels: ["type: concept"]
body:
  - type: markdown
    attributes:
      value: |
        Write short, simple and direct: bullet points, no filler, one thread from top to bottom.
        Link files and lines (`https://github.com/<owner>/<repo>/blob/<commit>/path#L10-L20`).
        A reader who knows Godot should understand the issue without reading the code.

  - type: textarea
    id: problem
    attributes:
      label: "Describe the problem or limitation you are having"
      description: "What is missing or does not fit together today. Link the code."
    validations:
      required: true

  - type: textarea
    id: questions
    attributes:
      label: "Which questions must the concept answer?"
      description: "Each question so that an answer decides something."
      value: |
        -
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: "Describe the options, with code, pseudo-code, mock-ups, and/or diagrams"
      description: "Each option with pros and cons. Check how Godot solves similar things first."
    validations:
      required: true

  - type: textarea
    id: recommendation
    attributes:
      label: "Recommendation and the features it leads to"
      description: "The chosen option and why; the feature issues it is split into (all go into the same release unless said otherwise)."

  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance criteria"
      description: "When is the concept done?"
      value: |
        - [ ] All questions answered in this issue
        - [ ] Recommendation agreed
        - [ ] Feature issues created and linked
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: "Area"
      description: "Which parts of the project are affected?"
      multiple: true
      options:
        - Core · core/ (Variant, Object, I/O, math)
        - Scene · scene/ (nodes, resources, GUI)
        - Servers · servers/ (rendering, physics, audio, navigation, text)
        - Editor · editor/
        - Modules · modules/ (GDScript, glTF, …)
        - .NET · modules/mono (C# bindings)
        - Platform & drivers · platform/, drivers/
        - Third-party · thirdparty/
        - Build & CI · SCons, .github/, misc/
        - Tests · tests/
        - Docs · doc/ (class reference)
    validations:
      required: true
