name: Feature proposal
description: "Propose a new feature or an enhancement, with the plan for the pull request."
title: "[Feature] "
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        Write short, simple and direct: bullet points, no filler, one thread from top to bottom.
        Link files and lines (`https://github.com/<owner>/<repo>/blob/<commit>/path#L10-L20`).
        A reader who knows Godot should understand the issue without reading the code.

  - type: textarea
    id: problem
    attributes:
      label: "Describe the problem or limitation you are having"
      description: "What you cannot do today, or only with much effort. Link the code that falls short."
      placeholder: |
        - `ResourceLoader` cannot list resource paths below a folder.
        - Projects walk the file system with `DirAccess` and miss files inside PCKs.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "Describe the feature / enhancement and how it helps to overcome the problem or limitation"
      description: "What is added or changed, and why the problem is gone then. In scope and out of scope."
    validations:
      required: true

  - type: textarea
    id: how
    attributes:
      label: "Describe how your proposal will work, with code, pseudo-code, mock-ups, and/or diagrams"
      description: "The API as users will write it (GDScript, C#), Inspector or dock mock-ups, diagrams (Mermaid works)."
      placeholder: |
        ```gdscript
        var paths := ResourceLoader.list_resource_paths("res://levels")
        ```
    validations:
      required: true

  - type: textarea
    id: plan
    attributes:
      label: "Describe the implementation plan"
      description: "New files and classes; existing files and methods to change, each linked to its lines. Steps in order. What is hard or unclear, and what was checked already (feasibility)."
      value: |
        **New**
        -

        **Changed**
        -

        **Steps**
        1.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: "If this enhancement will not be used often, can it be worked around with a few lines of script?"
      description: "Show the workaround, or say why there is none."
    validations:
      required: true

  - type: textarea
    id: core
    attributes:
      label: "Is there a reason why this should be core and not an add-on in the asset library?"
      description: "Why it belongs in the engine (performance, editor integration, every project needs it, needs engine internals)."
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance criteria"
      description: "Testable conditions. Done when all boxes are checked. The last five points are fixed."
      value: |
        - [ ]
        - [ ] C++ data structures and API created
        - [ ] C#/GDScript bindings created and registered
        - [ ] Documentation written (class reference in `doc/classes/` and wiki page: GDScript, C#, GDExtension)
        - [ ] Test build on the current platform done (no errors or warnings)
        - [ ] Tested in the test project (`res://<guide>/`: Example and Test) with a Mono build, in GDScript and in C#
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: "Area"
      description: "Which parts of the project are affected?"
      multiple: true
      options:
        - Core · core/ (Variant, Object, I/O, math)
        - Scene · scene/ (nodes, resources, GUI)
        - Servers · servers/ (rendering, physics, audio, navigation, text)
        - Editor · editor/
        - Modules · modules/ (GDScript, glTF, …)
        - .NET · modules/mono (C# bindings)
        - Platform & drivers · platform/, drivers/
        - Third-party · thirdparty/
        - Build & CI · SCons, .github/, misc/
        - Tests · tests/
        - Docs · doc/ (class reference)
    validations:
      required: true

  - type: dropdown
    id: platforms
    attributes:
      label: "Platforms"
      description: "Where must it work? Name in the plan what does not work where (Web is single-threaded, files only in user:// and the PCK)."
      multiple: true
      options:
        - All
        - Windows
        - Linux
        - macOS
        - Android
        - iOS
        - Web
