name: Review
description: A review of code, structure, documentation or design; the analysis comes first, then one issue per topic.
title: "[Review] "
labels: ["type: review"]
body:
  - type: markdown
    attributes:
      value: |
        Write short, simple and direct: bullet points, no filler, one thread from top to bottom. Link files and lines.
        A review analyses without changing anything. Findings are cut into refactoring, bug or feature issues per
        topic (not per file) and linked under Relations. Open questions are collected here.

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is reviewed (folders, classes, documents, screens) and what is not.
      value: |
        **In scope**
        -

        **Out of scope**
        -
    validations:
      required: true

  - type: textarea
    id: criteria
    attributes:
      label: Review criteria
      description: What the reviewers look for.
      value: |
        - KISS, Single Responsibility, Separation of Concerns, Composition over Inheritance, DRY
        - Names, folders, comments (only where the code cannot say it)
        - Configuration and state in data models, nothing hard-coded
        - The conventions in .agents/CONVENTIONS.md
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind
      multiple: true
      options:
        - Code
        - Structure & architecture
        - Documentation
        - UI / UX
        - Localization
        - Performance
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Core · core/ (Variant, Object, I/O, math)
        - Scene · scene/ (nodes, resources, GUI)
        - Servers · servers/ (rendering, physics, audio, navigation, text)
        - Editor · editor/
        - Modules · modules/ (GDScript, glTF, …)
        - .NET · modules/mono (C# bindings)
        - Platform & drivers · platform/, drivers/
        - Third-party · thirdparty/
        - Build & CI · SCons, .github/, misc/
        - Tests · tests/
        - Docs · doc/ (class reference)
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] Analysis of every part of the scope done, a summary of the findings in this issue
        - [ ] One issue per topic created and linked (Relations)
        - [ ] Questions to the owner answered or listed
        - [ ] All linked issues closed
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Earlier reviews, related issues, documents.
