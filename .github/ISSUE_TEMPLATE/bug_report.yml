name: Bug report
description: "Report a bug in this fork's engine features."
title: "[Bug] "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Write short, simple and direct: bullet points, no filler, one thread from top to bottom.
        Link files and lines (`https://github.com/<owner>/<repo>/blob/<commit>/path#L10-L20`).
        A reader who knows Godot should understand the issue without reading the code.

  - type: input
    id: version
    attributes:
      label: "Tested versions"
      description: "Release tag or commit where it happens, and where it does not."
      placeholder: "Reproducible in truely-v0.2.2 (a9982b1), not in truely-v0.2.1"
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: "System information"
      description: "OS, renderer, .NET or standard build."
      placeholder: "Windows 11, Vulkan Forward+, .NET build"

  - type: textarea
    id: description
    attributes:
      label: "Issue description"
      description: "What happens, what should happen instead. Screenshots and logs here."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      description: "Numbered, from a new project if possible."
      value: |
        1.
    validations:
      required: true

  - type: textarea
    id: cause
    attributes:
      label: "Cause and fix"
      description: "If known: the code at fault (linked) and the planned fix."

  - type: textarea
    id: logs
    attributes:
      label: "Logs"
      description: "Output, stack traces."
      render: text

  - type: dropdown
    id: area
    attributes:
      label: "Area"
      description: "Which parts of the project are affected?"
      multiple: true
      options:
        - Core · core/ (Variant, Object, I/O, math)
        - Scene · scene/ (nodes, resources, GUI)
        - Servers · servers/ (rendering, physics, audio, navigation, text)
        - Editor · editor/
        - Modules · modules/ (GDScript, glTF, …)
        - .NET · modules/mono (C# bindings)
        - Platform & drivers · platform/, drivers/
        - Third-party · thirdparty/
        - Build & CI · SCons, .github/, misc/
        - Tests · tests/
        - Docs · doc/ (class reference)
    validations:
      required: true
